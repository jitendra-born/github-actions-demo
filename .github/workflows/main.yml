name: System Information

on:
  push:
    branches:
      - main

jobs:
  info:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show System Information
        run: |
          echo "Hostname:"
          hostname

          echo "Current User:"
          whoami

          echo "Current Directory:"
          pwd

          echo "Disk Usage:"
          df -h

          echo "Memory:"
          free -m
